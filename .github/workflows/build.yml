name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saldo_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Достроить недостающие android/ios папки
        run: flutter create . --platforms=android --project-name saldo

      - run: flutter pub get

      - name: Собрать APK
        run: flutter build apk --release

      - name: Загрузить APK как результат сборки
        uses: actions/upload-artifact@v4
        with:
          name: saldo-app-apk
          path: saldo_app/build/app/outputs/flutter-apk/app-release.apk
